<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>StartWebcast output layers</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}iframe{border:0;position:absolute}#upper{inset:0;width:100%;height:100%;z-index:2;pointer-events:none}</style>

  <iframe id="lower" title="Lower webpage" sandbox="allow-scripts allow-same-origin" allow="autoplay"></iframe>
  <iframe id="upper" title="Upper HTML5 overlay" sandbox="allow-scripts allow-same-origin"></iframe>
</body>
</html>
