<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>StartWebcast output layers</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
    iframe{border:0;position:absolute}#upper{inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
    #startup{box-sizing:border-box;min-height:100%;padding:5vh 6vw;background:#160f20;color:#f5edff;font:2.3vh Arial,sans-serif}
    .startup-logo{width:27vh;height:16.85vh;overflow:hidden;margin-bottom:2vh}
    .startup-logo img{width:100%;height:auto;display:block}
    .startup-header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4vw;align-items:center;margin-bottom:2.5vh}
    h1,#player-name{margin:0;color:#ffac68;font-size:5vh;font-weight:700}
    #player-name{justify-self:end;text-align:right}
    #repository{color:#d8c3f1;margin:.75vh 0 0;font-size:2.1vh;overflow-wrap:anywhere}
    #diagnostics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.55vh 1.5vw;margin:0}
    #diagnostics div{min-width:0;border-top:1px solid #77569b;padding-top:1vh}
    dt{color:#d8c3f1;font-size:1.75vh;margin-bottom:.4vh}
    dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    #test-pattern{position:absolute;inset:0;background:#000;color:#fff;font:2.4vmin Arial,sans-serif}
    #uploaded-pattern{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
    .colour-bars{position:absolute;inset:0;display:grid;grid-template-rows:7fr 1fr 1fr 3fr}
    .bars-main{background:linear-gradient(90deg,#666 12.5%,#bfbfbf 12.5% 23.2%,#bfbf00 23.2% 33.9%,#00bfbf 33.9% 44.6%,#00bf00 44.6% 55.4%,#bf00bf 55.4% 66.1%,#bf0000 66.1% 76.8%,#0000bf 76.8% 87.5%,#666 87.5%)}
    .bars-colour{background:linear-gradient(90deg,#00ffff 12.5%,#003f69 12.5% 23.2%,#bfbfbf 23.2% 87.5%,#0000ff 87.5%)}
    .bars-ramp{display:grid;grid-template-columns:12.5% 10.7% 53.6% 10.7% 12.5%}
    .bars-ramp span:nth-child(1){background:#ffff00}.bars-ramp span:nth-child(2){background:#410077}
    .bars-ramp span:nth-child(3){background:linear-gradient(90deg,#000,#fff)}
    .bars-ramp span:nth-child(4){background:#fff}.bars-ramp span:nth-child(5){background:#f00}
    .bars-black{background:linear-gradient(90deg,#262626 12.5%,#000 12.5% 28.5%,#fff 28.5% 50%,#000 50% 59%,#0b0b0b 59% 62.5%,#000 62.5% 66%,#050505 66% 69.5%,#000 69.5% 73%,#111 73% 76.5%,#000 76.5% 87.5%,#262626 87.5%)}
    .alignment-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78vmin;height:78vmin;border:1px solid #fffd;border-radius:50%;box-shadow:0 0 0 1px #0008}
    .alignment-circle::before,.alignment-circle::after{content:"";position:absolute;background:#fffd;box-shadow:0 0 0 1px #0008}
    .alignment-circle::before{top:50%;left:50%;width:100vw;height:1px;transform:translateX(-50%)}
    .alignment-circle::after{top:50%;left:50%;width:1px;height:100vh;transform:translateY(-50%)}
    .pattern-label{position:absolute;top:3%;margin:0;padding:.6em .8em;background:#000e}
    #pattern-output{left:3%}#pattern-output strong,#pattern-output span{display:block}
    #pattern-output span{font-size:.8em;margin-top:.25em}
    #pattern-player{right:3%;color:#ffac68;font-size:1.45em;font-weight:700;text-align:right}
    @media (orientation:portrait){
      #startup{font-size:1.85vh;padding:3vh 5vw}
      .startup-header{grid-template-columns:minmax(0,1fr) auto;gap:1vh 2vw;margin-bottom:2vh}
      .startup-heading{grid-column:1 / -1;grid-row:2}
      #player-name{grid-column:2;grid-row:1}
      .startup-logo{width:21vh;height:13.1vh;margin-bottom:1vh}
      #diagnostics{grid-template-columns:repeat(2,minmax(0,1fr));gap:.85vh 2vw}
      #diagnostics div{padding-top:.65vh}
      dt{font-size:1.5vh}
      h1,#player-name{font-size:3.4vh}
    }
  </style>
  <script src="layer.js" defer></script>
</head>
<body>
  <main id="startup" hidden>
    <header class="startup-header">
      <div class="startup-logo"><img src="startwebcast.png" alt="StartWebcast"></div>
      <div class="startup-heading"><h1>SyncPlayer</h1><p id="repository"></p></div>
      <p id="player-name"></p>
    </header>
    <dl id="diagnostics"></dl>
  </main>
  <section id="test-pattern" aria-label="Test Pattern" hidden>
    <div class="colour-bars" aria-hidden="true"><div class="bars-main"></div><div class="bars-colour"></div><div class="bars-ramp"><span></span><span></span><span></span><span></span><span></span></div><div class="bars-black"></div></div>
    <div class="alignment-circle" aria-hidden="true"></div>
    <img id="uploaded-pattern" alt="" hidden>
    <p id="pattern-output" class="pattern-label"><strong>Test Pattern</strong><span></span></p>
    <p id="pattern-player" class="pattern-label"></p>
  </section>
  <iframe id="lower" title="Lower webpage" sandbox="allow-scripts allow-same-origin" allow="autoplay"></iframe>
  <iframe id="upper" title="Upper HTML5 overlay" sandbox="allow-scripts allow-same-origin"></iframe>
</body>
</html>
